name: Metrics
on:
  push:
    branches:
      - main
  schedule:
    # regenerate every 6 hours so newly pinned repos show up automatically
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ganddtn40
          filename: github-metrics.svg
          template: classic
          base: ""
          plugin_pinned: yes
          plugin_pinned_limit: 6
